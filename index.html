<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>my-cardgame</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="game-board">
            <!-- CPU側の手札 -->
            <section class="player-area cpu-area">
                <div class="hand-area">
                    <h2>CPUの手札</h2>
                    <div id="cpu-hand" class="card-row hand-row"></div>
                </div>
            
                <div class="status-area">
                    <h2>CPUの情報</h2>
                    <p>名前: <span id="cpu-name"></span></p>
                    <p>HP: <span id="cpu-hp"></span></p>
                    <p>PP: <span id="cpu-pp"></span></p>
                </div>

                <div class="field-area">
                    <h2>CPUの場</h2>
                    <div id="cpu-field" class="card-row field-row"></div>
                </div>
            </section> 
        
            <!-- 自分側 -->
            <section class="player-area player-area-bottom">
                <div class="field-area">
                    <h2>自分の場</h2>
                    <div id="player-field" class="card-row field-row"></div>
                </div>
            
                <div class="status-area">
                    <h2>自分の情報</h2>
                    <p>名前: <span id="player-name"></span></p>
                    <p>HP: <span id="player-hp"></span></p>
                    <p>PP: <span id="player-pp"></span></p>
                </div>
            
                <div class="hand-area">
                    <h2>自分の手札</h2>
                    <div id="player-hand" class="card-row hand-row"></div>
                </div>
                <div class="message-area">
                    <p id="battle-message">操作を選んでください。</p>
                </div>
                <div class="buttons">
                    <button id="battle-btn" type="button">バトル</button>
                    <button id="turn-end-btn" type="button">ターンエンド</button>
                </div>
            </section>
        </main>
        <script src="main.js"></script>
    </body>
</html>
