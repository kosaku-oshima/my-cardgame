<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>my-cardgame</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="game-board">

            <!-- CPU側の手札・ステータス表示 -->
            <div class="player-area">
                <div id="cpu-hand" class="cpu-hand-row"></div>
                <div class="status-area">
                    <h2>CPUの情報</h2>
                    <p>名前: <span id="cpu-name"></span></p>
                    <p>HP: <span id="cpu-hp"></span></p>
                    <p>PP: <span id="cpu-pp"></span></p>
                </div>
            </div>

            <!-- フィールド -->
            <div class="field">
                <div id="cpu-spell-field" class="field-row"></div> <!--将来的にspell用のエリアになる予定-->
                <div id="cpu-field" class="field-row"></div>
                <div id="player-field" class="field-row"></div>
                <div id="cpu-spell-field" class="field-row"></div> <!--将来的にspell用のエリアになる予定-->
            </div>
        
            <!-- 自分側の手札・ステータス表示 -->
            <div class="player-area">            
                <div class="status-area">
                    <h2>自分の情報</h2>
                    <p>名前: <span id="player-name"></span></p>
                    <p>HP: <span id="player-hp"></span></p>
                    <p>PP: <span id="player-pp"></span></p>
                </div>
                <fieldset class="message-area">
                    <legend>Message</legend>
                    <p id="game-message">▶ 操作を選んでください。</p>
                </fieldset>
                <div class="buttons">
                    <button id="battle-btn" type="button">バトル</button>
                    <button id="turn-end-btn" type="button">ターンエンド</button>
                </div>
                <div id="player-hand" class="hand-row"></div>
            </div>
        </main>
        <script src="main.js"></script>
    </body>
</html>
